<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="PRAVINVERSE animated professional profile">
 <style>
:root{color-scheme:dark}
@keyframes sparkle{0%,100%{opacity:.25}50%{opacity:.92}}
@keyframes tick{to{stroke-dashoffset:-130}}
@keyframes shimmer{0%,60%{transform:translateX(-700px)}95%,100%{transform:translateX(950px)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes arole{0%,22%{opacity:1}25%,100%{opacity:0}}
@keyframes brole{0%,22%{opacity:0}25%,48%{opacity:1}51%,100%{opacity:0}}
@keyframes crole{0%,48%{opacity:0}51%,73%{opacity:1}76%,100%{opacity:0}}
@keyframes drole{0%,73%{opacity:0}76%,98%{opacity:1}100%{opacity:0}}
@keyframes aslide{0%,29%{opacity:1}33%,99%{opacity:0}}
@keyframes bslide{0%,29%{opacity:0}33%,62%{opacity:1}66%,99%{opacity:0}}
@keyframes cslide{0%,62%{opacity:0}66%,96%{opacity:1}100%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-180}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes glow{0%,100%{filter:drop-shadow(0px 0px 3px #247bff)}50%{filter:drop-shadow(0px 0px 10px #247bff)}}
.spark{animation:sparkle 3.5s ease-in-out infinite}
.floater{animation:floaty 5s ease-in-out infinite}
.spinDash{animation:dash 18s linear infinite}
.sheen{animation:shimmer 8s ease-in-out infinite}
.roleA{animation:arole 12s linear infinite}.roleB{animation:brole 12s linear infinite}.roleC{animation:crole 12s linear infinite}.roleD{animation:drole 12s linear infinite}
.slideA{animation:aslide 12s linear infinite}.slideB{animation:bslide 12s linear infinite}.slideC{animation:cslide 12s linear infinite}
.pulse{animation:pulse 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.roleB,.roleC,.roleD,.slideB,.slideC{opacity:0!important}.roleA,.slideA{opacity:1!important}}
</style><defs>
