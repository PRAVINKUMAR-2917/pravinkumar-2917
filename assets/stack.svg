  <linearGradient id="red" x1="0" x2="1"><stop stop-color="#ff354f"/><stop offset="1" stop-color="#ff8f70"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#247bff" stop-opacity=".9"/><stop offset=".55" stop-color="#27314f"/><stop offset="1" stop-color="#ff354f" stop-opacity=".78"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#247bff" stop-opacity=".32"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2e466e" opacity=".40"/></pattern>
