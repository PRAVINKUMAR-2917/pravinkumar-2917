<text x="34" y="43" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#52edc9" letter-spacing="2.4">ENGINEERING / AI SYSTEMS</text><text x="34" y="91" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="800" fill="#f2f6ff" >MORE THAN DASHBOARDS.</text><text x="34" y="123" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="500" fill="#b5c7e4" >I connect data, models, APIs, products and cloud infrastructure.</text><rect x="35" y="150" width="448" height="110" rx="12" fill="#101d35" stroke="#30486e" /><rect x="35" y="150" width="5" height="110" rx="2" fill="#58e7cc"/><text x="55" y="180" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#58e7cc" letter-spacing=".8">AI &amp; LLM STACK</text><text x="55" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#e6edfa" >Google AI Studio  ·  Gemini API</text><text x="55" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#b9cce4" >Ollama  ·  Qwen  ·  LLM workflows</text><rect x="519" y="150" width="448" height="110" rx="12" fill="#101d35" stroke="#30486e" /><rect x="519" y="150" width="5" height="110" rx="2" fill="#79b4ff"/><text x="539" y="180" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#79b4ff" letter-spacing=".8">BACKEND + INTEGRATIONS</text><text x="539" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#e6edfa" >Python  ·  FastAPI  ·  REST APIs</text><text x="539" y="236" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#b9cce4" >Node.js  ·  Express  ·  JWT</text><rect x="35" y="278" width="448" height="110" rx="12" fill="#101d35" stroke="#30486e" /><rect x="35" y="278" width="5" height="110" rx="2" fill="#d08aff"/><text x="55" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#d08aff" letter-spacing=".8">DATABASES + CLOUD</text><text x="55" y="338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#e6edfa" >PostgreSQL  ·  Neon  ·  pgAdmin</text><text x="55" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#b9cce4" >Render  ·  Google Cloud  ·  GitHub Actions</text><rect x="519" y="278" width="448" height="110" rx="12" fill="#101d35" stroke="#30486e" /><rect x="519" y="278" width="5" height="110" rx="2" fill="#ff7397"/><text x="539" y="308" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#ff7397" letter-spacing=".8">BUILD + AUTOMATE</text><text x="539" y="338" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#e6edfa" >React  ·  TypeScript  ·  JavaScript</text><text x="539" y="364" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#b9cce4" >VS Code  ·  Visual Studio  ·  Git</text><rect x="35" y="414" width="931" height="47" rx="10" fill="#111e34" stroke="#2d4869" /><text x="55" y="444" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800" fill="#75ddfb" >PLUS:</text><text x="116" y="444" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#d8e8ff" >Power BI · DAX · Power Query · VBA · Pandas · NumPy · Streamlit · Claude Code · MCP</text><path class="dash" d="M68 399H929" stroke="#4fa2dc" opacity=".8" stroke-width="2" stroke-dasharray="5 13"/>
