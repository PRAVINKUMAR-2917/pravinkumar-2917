<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-label="Technical ecosystem: AI and LLMs, APIs, frontend, database, DevOps, developer tooling"><style>
@keyframes glow{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes fly{0%,100%{transform:translateY(0px)}50%{transform:translateY(-6px)}}
@keyframes dotrun{to{stroke-dashoffset:-70}}
@keyframes shimmer{0%{transform:translateX(-420px)}100%{transform:translateX(1120px)}}
@keyframes chartbar{0%,12%{transform:scaleY(.15)}36%,100%{transform:scaleY(1)}}
@keyframes scan{0%{transform:translateY(-300px)}100%{transform:translateY(800px)}}
.shine{animation:glow 4s ease-in-out infinite}.hover{animation:fly 5s ease-in-out infinite}.dash{animation:dotrun 8s linear infinite}.bar{transform-box:fill-box;transform-origin:center bottom;animation:chartbar 3.5s ease-out both}.sweep{animation:shimmer 7s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.bar{transform:scaleY(1)!important}}
</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c142b"/><stop offset=".54" stop-color="#080d1e"/><stop offset="1" stop-color="#1a1024"/></linearGradient>
<linearGradient id="c" x1="0" x2="1"><stop stop-color="#3cf5e0"/><stop offset=".5" stop-color="#3e8eff"/><stop offset="1" stop-color="#ff507c"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1"><stop stop-color="#3cf5e0" stop-opacity=".0"/><stop offset=".5" stop-color="#70d9ff" stop-opacity=".17"/><stop offset="1" stop-color="#ff507c" stop-opacity="0"/></linearGradient>
<linearGradient id="orange" x1="0" y1="0" x2="1"><stop stop-color="#3cf5e0"/><stop offset="1" stop-color="#417aff"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#223457" opacity=".32"/></pattern>
<clipPath id="panel"><rect x="1" y="1" width="998" height="498" rx="22"/></clipPath>
</defs>
<rect width="1000" height="490" rx="23" fill="url(#bg)"/>
<rect width="1000" height="490" rx="23" fill="url(#grid)" opacity=".8"/>
<rect x="1.5" y="1.5" width="997" height="487" rx="22" fill="none" stroke="#345b92" stroke-width="1.5"/>
